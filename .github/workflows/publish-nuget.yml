name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  tag-and-publish:
    if: github.actor == 'mircodz'
    environment: publish
    runs-on: ubuntu-latest
    env:
      VERSION_FILE: version
      PROJECT: src/Cellar/Cellar.csproj
      OUT_DIR: artifacts/nupkg
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Ensure main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases are published from main; this run is on ${GITHUB_REF}." >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        run: |
          version="$(tr -d '[:space:]' < "$VERSION_FILE")"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version '$version'. Expected MAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Ensure tag does not already exist
        run: |
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            echo "Tag $VERSION already exists. Bump the version file." >&2
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build and test
        run: |
          dotnet build -c Release --no-restore
          dotnet test -c Release --no-build

      - name: Pack
        run: dotnet pack "$PROJECT" -c Release --no-build -o "$OUT_DIR" /p:Version="$VERSION"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ${{ env.OUT_DIR }}/
          if-no-files-found: error

      - name: NuGet login
        id: nuget_login
        uses: NuGet/login@v1
        with:
          server: https://api.nuget.org/v3/index.json
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: |
          dotnet nuget push "$OUT_DIR"/*.nupkg \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate

      - name: Push to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push "$OUT_DIR"/*.nupkg \
            --source "https://nuget.pkg.github.com/${OWNER}/index.json" \
            --api-key "$GITHUB_TOKEN" \
            --skip-duplicate \
            --no-symbols

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"
